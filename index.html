<noscript><div class="wrap" style="padding-block:40px"><h1>Li Liu</h1><p>Li Liu is a Ph.D. candidate in Computer Science and Engineering at UC Santa Cruz, advised by Prof. Leilani H. Gilpin. Li studies spatial intelligence in multimodal models and the agents built on them: how models perceive space, build an internal map of it, and act when what they see is not enough. Li has interned three times as an Applied Scientist at Amazon and is on the 2027 job market for Research Scientist, Applied Scientist, and ML Engineer roles. Email: lliu112@ucsc.edu. <a href="https://scholar.google.com/citations?user=hLHzhqkAAAAJ">Google Scholar</a>. <a href="files/Li_Liu_resume.pdf">CV</a>.</p><ul><li>Perceive: vision-language models answer even when an image cannot support an answer; Right This Way (NeurIPS 2024) trains them to say how to move the camera instead.</li><li>Represent: language models read spatial layouts far better than they build them; learning to build layouts improves their spatial reasoning (Learning to Draw ASCII, COLM 2026).</li><li>Act: TouchingSpace, a real-time voice-and-touch agent on Gemini native audio that grounds its answers in a map, built from zero and tested with 14 blind and low-vision adults.</li></ul><h2>Projects</h2><ul><li>Directional Guidance for Vision-Language Models (Right This Way, NeurIPS 2024)</li><li>Spatial Reasoning in LLMs through Layout Construction (Learning to Draw ASCII, COLM 2026)</li><li>Real-Time Multimodal Agent Grounded in Touch (TouchingSpace, Under review, 2026)</li><li>Grounding Place Names in 3D-Printed Tactile Maps (Tactile Map Annotation, ASSETS 2026 Demo)</li><li>Human-AI Collaboration with Foundation Models: A Survey (Human-AI Collaboration Survey, ACM TIST 2026)</li><li>Human-in-the-Loop Pattern Discovery in Unlabeled Conversations (Pattern Insights Explorer, WWW 2026 Demo, Amazon)</li><li>Agent Skills as Typed, Inspectable Data (Skills on Board, Under review, 2026)</li><li>Experiential Search over User Reviews (SER, Amazon internship, 2024)</li><li>Multi-View Self-Supervised Pre-Training for 3D Medical Segmentation (SwinMM, MICCAI 2023)</li><li>Efficient Conformal Prediction with Shrunken Centroids (CPSC, IEEE TIM 2022)</li><li>Cross-User sEMG Domain Adaptation (Cross-User Taste Recognition, IEEE TIM 2022)</li><li>Data Augmentation for Label-Scarce Electronic Noses (Boost AI Power, IEEE Sensors Journal 2021)</li><li>Preventing Catastrophic Overfitting in FGSM Adversarial Training (Bag of Tricks for FGSM-AT, arXiv 2022)</li><li>Multi-Scale CNN for EEG Taste Recognition (EEG-MSRNet, IEEE TIM 2023)</li><li>sEMG-to-Speech Silent Speech Interface (Silent Speech Interface, IEEE TIM 2023)</li><li>EEG-EMG Fusion for Taste Recognition (Bi-FusionNet, ICASSP 2023)</li><li>Conformal Risk Triage for COVID-19 from CT (Tri-Light Warning System, EJR Open 2024)</li><li>Taste Intensity Recognition from Facial sEMG (Taste Intensity from Facial sEMG, Sensors 2021)</li><li>Temporal-Spectral Feature Extraction for Electronic Noses (Herbal Medicine Origins, arXiv 2021)</li><li>Light-Responsive Kinetic Pavilion (Lotus Pavilion, Undergraduate design, Zhejiang University)</li></ul><h2>Publications</h2><ul><li>Learning to Draw ASCII Improves Spatial Reasoning in Language Models. Shiyuan Huang, Li Liu, Jincheng He, Leilani H. Gilpin. Conference on Language Modeling (COLM), 2026. <a href="https://arxiv.org/abs/2604.14641">Link</a></li><li>From Anonymous Shapes to Named Places: A Tool for Braille and Place-Semantic Annotation of Tactile Maps. Li Liu, Ashmita Dua, Jiaming Qu, David T. Lee, Leilani H. Gilpin. ASSETS, Posters and Demonstrations, 2026. <a href="https://doi.org/10.1145/3797867.3841235">Link</a></li><li>Pattern Discovery with Wide-Lens Analysis and Sharp-Focus Validation. Li Liu, Omar Alonso, Giorgio Ballardin. The Web Conference (WWW), Demo Track, 2026. <a href="https://doi.org/10.1145/3774905.3793105">Link</a></li><li>Skills on Board: Maintaining Agent Skills as Typed Data. Li Liu, Jiaming Qu, Zhiyu Chen, Pei Zhang, Omar Alonso. Under review, 2026. <a href="https://youtu.be/G_XJpzWnH_c">Link</a></li><li>“I didn’t know how to read a map, but now I can”: TouchingSpace, an Audio-Haptic Map for Blind and Low-Vision Readers. Li Liu, Yihe Wang, Jiaming Qu, Ashmita Dua, David T. Lee, Leilani H. Gilpin. arXiv preprint, 2026. <a href="https://arxiv.org/abs/2609.36404">Link</a></li><li>Right This Way: Can VLMs Guide Us to See More to Answer Questions?. Li Liu, Diji Yang, Sijia Zhong, Kalyana Suma Sree Tholeti, Lei Ding, Yi Zhang, Leilani H. Gilpin. Neural Information Processing Systems (NeurIPS), 2024. <a href="https://proceedings.neurips.cc/paper_files/paper/2024/file/efe4e50d492fedc0dfd2959f3320a974-Paper-Conference.pdf">Link</a></li><li>A Tri-Light Warning System for Hospitalized COVID-19 Patients: Credibility-Based Risk Stratification for Future Pandemic Preparedness. Chuanjun Xu, Qinmei Xu, Li Liu, Mu Zhou, Zijian Xing, Zhen Zhou, Danyang Ren, Changsheng Zhou, Longjiang Zhang, Xiao Li, Xianghao Zhan, Olivier Gevaert, Guangming Lu. European Journal of Radiology Open, 2024. <a href="https://www.sciencedirect.com/science/article/pii/S2352047724000583">Link</a></li><li>A Survey on Human-AI Collaboration with Large Foundation Models. Vanshika Vats, Marzia Binta Nizam, Minghao Liu, Ziyuan Wang, Richard Ho, Mohnish Sai Prasad, Vincent Titterton, Sai Venkat Malreddy, Riya Aggarwal, Yanwen Xu, Lei Ding, Jay Mehta, Nathan Grinnell, Li Liu, Sijia Zhong, Devanathan Nallur Gandamani, Xinyi Tang, Rohan Ghosalkar, Celeste Shen, Rachel Shen, Nafisa Hussain, Kesav Ravichandran, James Davis. ACM Transactions on Intelligent Systems and Technology, 2026. <a href="https://doi.org/10.1145/3841472">Link</a></li><li>SwinMM: Masked Multi-view with Swin Transformers for 3D Medical Image Segmentation. Yiqing Wang, Zihan Li, Zihao Wei, Jieru Mei, Li Liu, Chen Wang, Shengtian Sang, Alan Yuille, Cihang Xie, Yuyin Zhou. MICCAI, 2023. <a href="https://arxiv.org/abs/2307.12591">Link</a></li><li>Bimodal Fusion Network for Basic Taste Sensation Recognition from Electroencephalography and Electromyography. Han Gao, Shuo Zhao, Huiyan Li, Li Liu, You Wang, Ruifen Hu, Jin Zhang, Guang Li. ICASSP, 2023. <a href="https://ieeexplore.ieee.org/document/10095117">Link</a></li><li>Basic Taste Sensation Recognition from EEG Based on Multi-Scale Convolutional Neural Network with Residual Learning. Han Gao, Shuo Zhao, Huiyan Li, Li Liu, Hengyang Wang, You Wang, Zhiyuan Luo, Jin Zhang, Guang Li. IEEE Transactions on Instrumentation and Measurement, 2023. <a href="https://ieeexplore.ieee.org/abstract/document/10138514/">Link</a></li><li>Silent Speech Interface with Vocal Speaker Assistance Based on Convolution-augmented Transformer. Huiyan Li, Yihao Liang, Han Gao, Li Liu, You Wang, Daqi Chen, Zhiyuan Luo, Guang Li. IEEE Transactions on Instrumentation and Measurement, 2023. <a href="https://ieeexplore.ieee.org/document/10121584">Link</a></li><li>CPSC: Conformal Prediction With Shrunken Centroids for Efficient Prediction Reliability Quantification and Data Augmentation, a Case in Alternative Herbal Medicine Classification With Electronic Nose. Li Liu, Xianghao Zhan, Xikai Yang, Xiaoqing Guan, Rumeng Wu, Zhan Wang, Zhiyuan Luo, You Wang, Guang Li. IEEE Transactions on Instrumentation and Measurement, 2022. <a href="https://ieeexplore.ieee.org/abstract/document/9667498">Link</a></li><li>Unsupervised Cross-User Adaptation in Taste Sensation Recognition Based on Surface Electromyography with Conformal Prediction and Domain Regularized Component Analysis. Hengyang Wang, Xianghao Zhan, Li Liu, Asif Ullah, Huiyan Li, Han Gao, You Wang, Ruifen Hu, Guang Li. IEEE Transactions on Instrumentation and Measurement, 2022. <a href="https://ieeexplore.ieee.org/document/9777907">Link</a></li><li>Bag of Tricks for FGSM Adversarial Training. Zichao Li, Li Liu, Zeyu Wang, Yuyin Zhou, Cihang Xie. arXiv preprint, 2022. <a href="https://arxiv.org/abs/2209.02684">Link</a></li><li>Boost AI Power:
